name: Check BFI tickets

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test_message:
        description: "Send a Telegram test message"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bfi-ticket-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEND_TEST_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_message || 'false' }}
      STARTUP_MESSAGE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python check_once.py
